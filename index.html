<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hillsides Staff</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      color: #17365d;
      letter-spacing: 1px;
    }

    .header p {
      margin-top: 8px;
      color: #667085;
      font-size: 16px;
    }

    .language-screen {
      text-align: center;
      margin-top: 40px;
    }

    .language-screen h2 {
      color: #17365d;
      margin-bottom: 8px;
    }

    .language-screen p {
      color: #667085;
      margin-bottom: 30px;
    }

    .language-button {
      display: block;
      width: 100%;
      padding: 20px;
      margin-bottom: 16px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #17365d;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .language-button:active {
      transform: scale(0.98);
    }

    .menu-button {
      display: block;
      width: 100%;
      padding: 22px;
      margin-bottom: 16px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #17365d;
      font-size: 18px;
      font-weight: bold;
      text-align: left;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    .icon {
      font-size: 24px;
      margin-right: 12px;
    }

    .change-language {
      margin-top: 30px;
      text-align: center;
    }

    .change-language button {
      border: none;
      background: none;
      color: #475467;
      font-size: 15px;
      text-decoration: underline;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #98a2b3;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
