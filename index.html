<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hillsides Staff</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      margin: 0;
      font-size: 34px;
      color: #17365d;
      letter-spacing: 1px;
    }

    .header p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 16px;
    }

    .language-area {
      text-align: center;
    }

    .language-area h2 {
      margin-bottom: 5px;
      color: #17365d;
    }

    .language-area p {
      margin-top: 0;
      margin-bottom: 30px;
      color: #667085;
    }

    .button {
      display: block;
      width: 100%;
      margin-bottom: 18px;
      padding: 20px;
      border: none;
      border-radius: 14px;
      background-color: #ffffff;
      color: #17365d;
      font-size: 19px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      cursor: pointer;
    }

    .button:active {
      transform: scale(0.98);
    }

    .menu-button {
      text-align: left;
      padding: 22px;
    }

    .change-language {
      margin-top: 35px;
      text-align: center;
    }

    .change-language button {
      padding: 10px;
      border: none;
      background-color: transparent;
      color: #475467;
      font-size: 15px;
      text-decoration: underline;
      cursor: pointer;
    }

    .footer {
      margin-top: 45px;
      text-align: center;
      color: #98a2b3;
      font-size: 13px;
    }
  </style>

</head>

<body>

  <div class="container">

    <!-- LANGUAGE SCREEN -->

    <div id="languageScreen">

      <div class="header">
        <h1>HILLSIDES</h1>
        <p>Staff Portal</p>
      </div>

      <div class="language-area">

        <h2>Select your language</h2>

        <p>Seleccione su idioma</p>

        <button
          type="button"
          class="button"
          onclick="showEnglish()">
          🇬🇧 English
        </button>

        <button
          type="button"
          class="button"
          onclick="showSpanish()">
          🇪🇸 Español
        </button>

      </div>

      <div class="footer">
        Hillsides Staff Portal
      </div>

    </div>


    <!-- ENGLISH MENU -->

    <div id="englishMenu" style="display: none;">

      <div class="header">
        <h1>HILLSIDES</h1>
        <p>Staff Portal</p>
      </div>

      <button
        type="button"
        class="button menu-button">
        🔄 &nbsp; Request Shift Swap
      </button>

      <button
        type="button"
        class="button menu-button">
        ✍️ &nbsp; Accept Shift Swap
      </button>

      <button
        type="button"
        class="button menu-button">
        ℹ️ &nbsp; Information
      </button>

      <div class="change-language">

        <button
          type="button"
          onclick="showLanguages()">
          🌐 Change language
        </button>

      </div>

      <div class="footer">
        Hillsides Staff Portal
      </div>

    </div>


    <!-- SPANISH MENU -->

    <div id="spanishMenu" style="display: none;">

      <div class="header">
        <h1>HILLSIDES</h1>
        <p>Portal del personal</p>
      </div>

      <button
        type="button"
        class="button menu-button">
        🔄 &nbsp; Solicitar cambio de turno
      </button>

      <button
        type="button"
        class="button menu-button">
        ✍️ &nbsp; Aceptar cambio de turno
      </button>

      <button
        type="button"
        class="button menu-button">
        ℹ️ &nbsp; Información
      </button>

      <div class="change-language">

        <button
          type="button"
          onclick="showLanguages()">
          🌐 Cambiar idioma
        </button>

      </div>

      <div class="footer">
        Hillsides Staff Portal
      </div>

    </div>

  </div>


  <script>

    function showEnglish() {

      document.getElementById("languageScreen").style.display = "none";
      document.getElementById("spanishMenu").style.display = "none";
      document.getElementById("englishMenu").style.display = "block";

    }


    function showSpanish() {

      document.getElementById("languageScreen").style.display = "none";
      document.getElementById("englishMenu").style.display = "none";
      document.getElementById("spanishMenu").style.display = "block";

    }


    function showLanguages() {

      document.getElementById("englishMenu").style.display = "none";
      document.getElementById("spanishMenu").style.display = "none";
      document.getElementById("languageScreen").style.display = "block";

    }

  </script>

</body>

</html>
