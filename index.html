<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hillsides Staff</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17365d;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 50px;
    }

    .language-button {
      width: 100%;
      padding: 20px;
      margin-bottom: 18px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #17365d;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>HILLSIDES</h1>
    <div class="subtitle">Staff Portal</div>

    <h2>Select your language</h2>
    <p>Seleccione su idioma</p>

    <button class="language-button">
      🇬🇧 English
    </button>

    <button class="language-button">
      🇪🇸 Español
    </button>

  </div>

</body>
</html>
